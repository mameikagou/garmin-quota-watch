<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手表额度 · GPT / Claude</title>
  <style>
    :root { color-scheme:dark; font-family:system-ui,"Noto Sans CJK SC",sans-serif; color:#eef3f7; background:#090b0d; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:960px; margin:auto; padding:40px 20px 64px; }
    .eyebrow { color:#73ebc0; font-size:13px; letter-spacing:2px; }
    h1 { font-size:clamp(30px,6vw,48px); line-height:1.15; margin:14px 0; letter-spacing:-1px; }
    .downloads { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:28px 0 32px; }
    .download-prg { display:flex; align-items:center; gap:14px; color:inherit; text-decoration:none; background:#141a20; border:1px solid #2c3843; border-radius:18px; padding:20px; }
    .download-prg:hover { border-color:#73ebc0; background:#1a232b; }
    .download-prg .symbol { width:48px; height:48px; border-radius:50%; display:grid; place-items:center; background:#243b35; color:#73ebc0; font-size:24px; }
    .download-prg strong { display:block; font-size:22px; }
    .gallery { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    figure { margin:0; padding:22px 16px; border:1px solid #232d36; border-radius:22px; background:#101419; scroll-margin-top:16px; }
    figure img { display:block; width:100%; max-width:390px; margin:auto; height:auto; border-radius:50%; background:#000; }
    figcaption { max-width:390px; margin:18px auto 0; }
    h2 { font-size:20px; margin:0; }
    p { color:#9aaab8; margin:7px 0 0; }
    @media(max-width:620px) { main { padding:24px 12px 40px; } .gallery { grid-template-columns:1fr; } .downloads { gap:10px; } .download-prg { padding:15px 12px; gap:9px; } .download-prg .symbol { width:36px; height:36px; } .download-prg strong { font-size:20px; } }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">VÍVOACTIVE 5 · 个人额度</div>
  <h1>抬腕，看清剩余额度。</h1>
  <div class="downloads">
    <a class="download-prg" href="/GPT.prg" download="GPT.prg"><span class="symbol">G</span><strong>下载 GPT</strong></a>
    <a class="download-prg" href="/Claude.prg" download="Claude.prg"><span class="symbol">C</span><strong>下载 Claude</strong></a>
  </div>
  <section class="gallery" id="simulator-results" aria-label="模拟器截图">
    <figure id="home"><a href="/simulator.png"><img src="/simulator.png" alt="主页"></a><figcaption><h2>主页</h2></figcaption></figure>
    <figure id="detail"><a href="/simulator-detail.png"><img src="/simulator-detail.png" alt="详情页"></a><figcaption><h2>详情页</h2><p>打开即刷新当前服务，缓存始终可用。</p></figcaption></figure>
    <figure id="zcode"><a href="/simulator-zcode.png"><img src="/simulator-zcode.png" alt="ZCode 详情页"></a><figcaption><h2>ZCode · 详情页</h2></figcaption></figure>
    <figure id="gpt-announced"><a href="/simulator-gpt-announced.png"><img src="/simulator-gpt-announced.png" alt="GPT 概览，有 Tibo 预告"></a><figcaption><h2>GPT · Tibo 预告</h2></figcaption></figure>
    <figure id="gpt"><a href="/simulator-gpt.png"><img src="/simulator-gpt.png" alt="GPT 概览"></a><figcaption><h2>GPT</h2></figcaption></figure>
    <figure id="claude"><a href="/simulator-claude.png"><img src="/simulator-claude.png" alt="Claude 概览"></a><figcaption><h2>Claude</h2></figcaption></figure>
  </section>
</main>
</body>
</html>
